name = "fomo-radar-launch"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Every 2 minutes: one KV write per run keeps us under the free 1,000 writes/day.
[triggers]
crons = ["*/2 * * * *"]

[[kv_namespaces]]
binding = "STATE"
id = "0e8665343d464eb887d0051d3126575f"

[observability]
enabled = true

# Secret (wrangler secret put CRON_SECRET, same value as fomo-radar-cron): CRON_SECRET
